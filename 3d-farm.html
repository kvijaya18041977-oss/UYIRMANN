<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Crop Grow | UYIRMANN</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#06120b;
    color:white;
    overflow:hidden;
}

#game{
    position:fixed;
    inset:0;
}

canvas{
    display:block;
}

.topbar{
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:10;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 25px;
    background:linear-gradient(
        180deg,
        rgba(3,15,9,.95),
        rgba(3,15,9,.45),
        transparent
    );
}

.logo{
    font-size:24px;
    font-weight:900;
    letter-spacing:2px;
}

.logo span{
    color:#7bdc52;
}

.points{
    background:rgba(0,0,0,.55);
    border:1px solid rgba(123,220,82,.35);
    padding:10px 18px;
    border-radius:30px;
    backdrop-filter:blur(10px);
}

.points strong{
    color:#8cff61;
}

.panel{
    position:fixed;
    z-index:10;
    left:20px;
    top:95px;
    width:280px;
    padding:20px;
    border-radius:20px;
    background:rgba(3,15,9,.82);
    border:1px solid rgba(123,220,82,.25);
    backdrop-filter:blur(15px);
    box-shadow:0 15px 50px rgba(0,0,0,.4);
}

.panel h2{
    font-size:20px;
    margin-bottom:6px;
}

.panel p{
    color:#a8b8ad;
    font-size:13px;
    line-height:1.5;
    margin-bottom:15px;
}

.crop-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
}

.crop-btn{
    border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.06);
    color:white;
    padding:11px 7px;
    border-radius:12px;
    cursor:pointer;
    transition:.25s;
}

.crop-btn:hover,
.crop-btn.active{
    background:rgba(123,220,82,.18);
    border-color:#7bdc52;
    transform:translateY(-2px);
}

.action-area{
    position:fixed;
    z-index:10;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:10px;
    padding:12px;
    border-radius:22px;
    background:rgba(3,15,9,.85);
    border:1px solid rgba(123,220,82,.25);
    backdrop-filter:blur(15px);
}

.action{
    border:none;
    padding:13px 18px;
    border-radius:13px;
    color:white;
    background:#183b25;
    cursor:pointer;
    font-weight:bold;
    transition:.2s;
}

.action:hover{
    background:#28633b;
    transform:translateY(-2px);
}

.action.harvest{
    background:#607d24;
}

.status{
    position:fixed;
    z-index:10;
    right:20px;
    top:95px;
    width:230px;
    padding:18px;
    border-radius:20px;
    background:rgba(3,15,9,.82);
    border:1px solid rgba(123,220,82,.25);
    backdrop-filter:blur(15px);
}

.status-title{
    color:#8cff61;
    font-size:12px;
    letter-spacing:2px;
    margin-bottom:8px;
}

.growth-bar{
    height:9px;
    background:#15231a;
    border-radius:20px;
    overflow:hidden;
    margin-top:10px;
}

.growth-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#4d9e35,#a6ef62);
    transition:.5s;
}

.message{
    position:fixed;
    z-index:20;
    left:50%;
    top:80px;
    transform:translateX(-50%) translateY(-20px);
    opacity:0;
    background:rgba(5,25,13,.95);
    border:1px solid #72d64b;
    padding:12px 20px;
    border-radius:30px;
    transition:.35s;
    pointer-events:none;
}

.message.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

.home{
    position:fixed;
    z-index:20;
    right:20px;
    bottom:25px;
    padding:12px 17px;
    border-radius:14px;
    color:white;
    text-decoration:none;
    background:rgba(3,15,9,.85);
    border:1px solid rgba(123,220,82,.3);
}

@media(max-width:700px){

    .panel{
        left:10px;
        top:75px;
        width:210px;
        padding:14px;
    }

    .status{
        right:10px;
        top:75px;
        width:175px;
        padding:14px;
    }

    .crop-grid{
        gap:6px;
    }

    .crop-btn{
        padding:8px 4px;
        font-size:11px;
    }

    .action-area{
        bottom:12px;
        width:95%;
        justify-content:center;
    }

    .action{
        padding:11px 10px;
        font-size:12px;
    }

    .home{
        display:none;
    }
}
</style>
</head>

<body>

<div id="game"></div>

<header class="topbar">
    <div class="logo">UYIR<span>MANN</span></div>

    <div class="points">
        🌾 Farm Points:
        <strong id="points">0</strong>
    </div>
</header>

<div class="panel">

    <h2>🌱 Choose Your Crop</h2>

    <p>
        Select a crop and plant it in your virtual Tamil Nadu farm.
    </p>

    <div class="crop-grid">

        <button class="crop-btn active" data-crop="paddy">
            🌾 Paddy
        </button>

        <button class="crop-btn" data-crop="banana">
            🍌 Banana
        </button>

        <button class="crop-btn" data-crop="maize">
            🌽 Maize
        </button>

        <button class="crop-btn" data-crop="millet">
            🌱 Millet
        </button>

        <button class="crop-btn" data-crop="sugarcane">
            🍬 Sugarcane
        </button>

        <button class="crop-btn" data-crop="groundnut">
            🥜 Groundnut
        </button>

    </div>

</div>

<div class="status">

    <div class="status-title">FIELD STATUS</div>

    <div id="cropName">Paddy</div>

    <div style="margin-top:10px;font-size:13px;color:#a8b8ad;">
        Growth
        <strong id="growthText">0%</strong>
    </div>

    <div class="growth-bar">
        <div class="growth-fill" id="growthFill"></div>
    </div>

    <div style="margin-top:13px;font-size:13px;color:#a8b8ad;">
        💧 Water:
        <span id="water">0</span>
    </div>

    <div style="margin-top:7px;font-size:13px;color:#a8b8ad;">
        🌱 Stage:
        <span id="stage">Empty Field</span>
    </div>

</div>

<div class="message" id="message"></div>

<div class="action-area">

    <button class="action" id="plantBtn">
        🌱 Plant
    </button>

    <button class="action" id="waterBtn">
        💧 Water
    </button>

    <button class="action" id="growBtn">
        ☀️ Grow
    </button>

    <button class="action harvest" id="harvestBtn">
        🧺 Harvest
    </button>

</div>

<a class="home" href="index.html">
    ← UYIRMANN
</a>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

let scene;
let camera;
let renderer;
let farm;
let cropGroup = null;

let selectedCrop = "paddy";
let planted = false;
let growth = 0;
let water = 0;
let points = 0;

const cropName = document.getElementById("cropName");
const growthText = document.getElementById("growthText");
const growthFill = document.getElementById("growthFill");
const waterText = document.getElementById("water");
const stageText = document.getElementById("stage");
const pointsText = document.getElementById("points");
const message = document.getElementById("message");

init();
animate();

function init(){

    scene = new THREE.Scene();

    scene.background = new THREE.Color(0x82b9d2);

    scene.fog = new THREE.Fog(
        0x82b9d2,
        20,
        75
    );

    camera = new THREE.PerspectiveCamera(
        55,
        window.innerWidth / window.innerHeight,
        .1,
        200
    );

    camera.position.set(
        0,
        12,
        20
    );

    camera.lookAt(0,0,0);

    renderer = new THREE.WebGLRenderer({
        antialias:true
    });

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio,2)
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.shadowMap.enabled = true;

    document
        .getElementById("game")
        .appendChild(renderer.domElement);

    createLights();
    createSky();
    createFarm();

    window.addEventListener(
        "resize",
        resize
    );
}

function createLights(){

    const ambient =
        new THREE.HemisphereLight(
            0xffffff,
            0x345d35,
            2
        );

    scene.add(ambient);

    const sun =
        new THREE.DirectionalLight(
            0xffffff,
            3
        );

    sun.position.set(
        -15,
        25,
        10
    );

    sun.castShadow = true;

    scene.add(sun);
}

function createSky(){

    const sun =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                2.2,
                32,
                32
            ),
            new THREE.MeshBasicMaterial({
                color:0xffe6a0
            })
        );

    sun.position.set(
        -18,
        22,
        -25
    );

    scene.add(sun);

    for(let i=0;i<12;i++){

        const cloud =
            new THREE.Mesh(
                new THREE.SphereGeometry(
                    Math.random()*1.5+.7,
                    16,
                    16
                ),
                new THREE.MeshStandardMaterial({
                    color:0xffffff,
                    transparent:true,
                    opacity:.75
                })
            );

        cloud.position.set(
            Math.random()*50-25,
            14+Math.random()*7,
            Math.random()*30-30
        );

        scene.add(cloud);
    }
}

function createFarm(){

    farm = new THREE.Group();

    scene.add(farm);

    const ground =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                70,
                70
            ),
            new THREE.MeshStandardMaterial({
                color:0x406c32
            })
        );

    ground.rotation.x =
        -Math.PI/2;

    ground.receiveShadow = true;

    farm.add(ground);

    createField();

    createTrees();

    createWaterChannel();

    createHouse();
}

function createField(){

    const soil =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                15,
                .35,
                12
            ),
            new THREE.MeshStandardMaterial({
                color:0x704c2c
            })
        );

    soil.position.y=.2;

    soil.receiveShadow=true;

    farm.add(soil);

    for(let x=-6;x<=6;x+=2){

        const line =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .12,
                    .05,
                    11
                ),
                new THREE.MeshStandardMaterial({
                    color:0x4f321d
                })
            );

        line.position.set(
            x,
            .4,
            0
        );

        farm.add(line);
    }
}

function createTrees(){

    for(let i=0;i<14;i++){

        const trunk =
            new THREE.Mesh(
                new THREE.CylinderGeometry(
                    .25,
                    .35,
                    2,
                    8
                ),
                new THREE.MeshStandardMaterial({
                    color:0x69452b
                })
            );

        const crown =
            new THREE.Mesh(
                new THREE.SphereGeometry(
                    1.4,
                    12,
                    12
                ),
                new THREE.MeshStandardMaterial({
                    color:0x236b35
                })
            );

        const x =
            Math.random()*45-22;

        const z =
            Math.random()*45-22;

        if(Math.abs(x)<10 &&
           Math.abs(z)<9) continue;

        trunk.position.set(
            x,
            1,
            z
        );

        crown.position.set(
            x,
            2.5,
            z
        );

        scene.add(trunk);
        scene.add(crown);
    }
}

function createWaterChannel(){

    const waterMesh =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                3,
                .12,
                18
            ),
            new THREE.MeshStandardMaterial({
                color:0x39a9df,
                transparent:true,
                opacity:.8
            })
        );

    waterMesh.position.set(
        11,
        .12,
        0
    );

    scene.add(waterMesh);
}

function createHouse(){

    const house =
        new THREE.Group();

    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                5,
                3,
                4
            ),
            new THREE.MeshStandardMaterial({
                color:0xd4a66a
            })
        );

    body.position.y=1.7;

    house.add(body);

    const roof =
        new THREE.Mesh(
            new THREE.ConeGeometry(
                3.8,
                2.5,
                4
            ),
            new THREE.MeshStandardMaterial({
                color:0x713a25
            })
        );

    roof.position.y=4;

    roof.rotation.y=Math.PI/4;

    house.add(roof);

    house.position.set(
        -17,
        0,
        -14
    );

    scene.add(house);
}

function plantCrop(){

    if(planted){

        showMessage("Your crop is already planted 🌱");
        return;
    }

    planted=true;
    growth=5;
    water=0;

    createCrop();

    updateUI();

    showMessage(
        "🌱 "+capitalize(selectedCrop)+" planted!"
    );
}

function createCrop(){

    if(cropGroup)
        scene.remove(cropGroup);

    cropGroup =
        new THREE.Group();

    const positions=[];

    for(let x=-5;x<=5;x+=2){

        for(let z=-4;z<=4;z+=2){

            positions.push({
                x:x,
                z:z
            });

        }
    }

    positions.forEach(pos=>{

        const plant =
            createPlant(
                selectedCrop
            );

        plant.position.set(
            pos.x,
            .4,
            pos.z
        );

        plant.scale.set(
            .05,
            .05,
            .05
        );

        cropGroup.add(plant);

    });

    scene.add(cropGroup);
}

function createPlant(type){

    const group =
        new THREE.Group();

    let color=0x4d9f38;

    if(type==="paddy")
        color=0x68b943;

    if(type==="banana")
        color=0x2e8c3d;

    if(type==="maize")
        color=0x76a83b;

    if(type==="millet")
        color=0x709c3e;

    if(type==="sugarcane")
        color=0x3e8e3c;

    if(type==="groundnut")
        color=0x57943d;

    const stem =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .08,
                .1,
                1.5,
                8
            ),
            new THREE.MeshStandardMaterial({
                color:color
            })
        );

    stem.position.y=.75;

    stem.castShadow=true;

    group.add(stem);

    for(let i=0;i<5;i++){

        const leaf =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .12,
                    .8,
                    .04
                ),
                new THREE.MeshStandardMaterial({
                    color:color
                })
            );

        leaf.position.y=
            .5+i*.18;

        leaf.rotation.z=
            (i%2===0 ? .5 : -.5);

        group.add(leaf);
    }

    return group;
}

function waterCrop(){

    if(!planted){

        showMessage(
            "Plant a crop first 🌱"
        );

        return;
    }

    water+=20;

    if(water>100)
        water=100;

    growth+=8;

    if(growth>100)
        growth=100;

    updateCropSize();
    updateUI();

    showMessage(
        "💧 Your crop received water!"
    );
}

function growCrop(){

    if(!planted){

        showMessage(
            "Plant a crop first 🌱"
        );

        return;
    }

    if(water<10){

        showMessage(
            "💧 The crop needs water!"
        );

        return;
    }

    growth+=15;

    if(growth>100)
        growth=100;

    water-=10;

    updateCropSize();
    updateUI();

    showMessage(
        "☀️ Your crop is growing!"
    );
}

function harvestCrop(){

    if(!planted){

        showMessage(
            "There is no crop to harvest."
        );

        return;
    }

    if(growth<100){

        showMessage(
            "🌾 The crop is not ready yet!"
        );

        return;
    }

    points+=100;

    pointsText.textContent=
        points;

    planted=false;
    growth=0;
    water=0;

    if(cropGroup){

        scene.remove(
            cropGroup
        );

        cropGroup=null;
    }

    updateUI();

    showMessage(
        "🧺 Harvest complete! +100 points"
    );
}

function updateCropSize(){

    if(!cropGroup)
        return;

    const scale =
        .05+
        (growth/100)*.95;

    cropGroup.scale.set(
        scale,
        scale,
        scale
    );
}

function updateUI(){

    cropName.textContent=
        capitalize(selectedCrop);

    growthText.textContent=
        growth+"%";

    growthFill.style.width=
        growth+"%";

    waterText.textContent=
        water;

    if(!planted)
        stageText.textContent=
            "Empty Field";
    else if(growth<25)
        stageText.textContent=
            "Seedling";
    else if(growth<60)
        stageText.textContent=
            "Growing";
    else if(growth<100)
        stageText.textContent=
            "Maturing";
    else
        stageText.textContent=
            "Ready to Harvest";
}

function capitalize(text){

    return text.charAt(0).toUpperCase()+
        text.slice(1);
}

function showMessage(text){

    message.textContent=text;

    message.classList.add(
        "show"
    );

    setTimeout(()=>{

        message.classList.remove(
            "show"
        );

    },1800);
}

function resize(){

    camera.aspect=
        window.innerWidth/
        window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
}

function animate(){

    requestAnimationFrame(
        animate
    );

    if(cropGroup){

        cropGroup.children.forEach(
            (plant,i)=>{

                plant.rotation.z=
                    Math.sin(
                        Date.now()*.001+i
                    )*.015;

            }
        );
    }

    renderer.render(
        scene,
        camera
    );
}

/* Crop selection */

document
.querySelectorAll(".crop-btn")
.forEach(button=>{

    button.addEventListener(
        "click",
        ()=>{

            document
            .querySelectorAll(".crop-btn")
            .forEach(btn=>
                btn.classList.remove("active")
            );

            button.classList.add(
                "active"
            );

            selectedCrop=
                button.dataset.crop;

            cropName.textContent=
                capitalize(selectedCrop);

            if(planted){

                showMessage(
                    "Harvest your current crop before changing it."
                );

                return;
            }

            showMessage(
                "Selected: "+
                capitalize(selectedCrop)
            );

        }
    );

});

document
.getElementById("plantBtn")
.addEventListener(
    "click",
    plantCrop
);

document
.getElementById("waterBtn")
.addEventListener(
    "click",
    waterCrop
);

document
.getElementById("growBtn")
.addEventListener(
    "click",
    growCrop
);

document
.getElementById("harvestBtn")
.addEventListener(
    "click",
    harvestCrop
);

</script>

</body>
</html>
